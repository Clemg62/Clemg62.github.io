<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
</head> 
<body>
    
    <h1>Ma position (avec le getCurrentPosition)</h1>
    <p id="lat">Latitude : </p>
    <p id="lon">Longitude : </p>
    <p id="alt">Altitude : </p>
    <h2 id="pre">Précision</h2>
    <h3 id="vit">Vitesse</h3>
    <h4 id="dat">Date</h4>

    <h1>Ma position (avec le watch)</h1>
    <p id="lat2">Latitude : </p>
    <p id="lon2">Longitude : </p>
    <p id="alt2">Altitude : </p>
    <h2 id="pre2">Précision</h2>
    <h3 id="vit2">Vitesse</h3>
    <h4 id="dat2">Date</h4>

     <div id="map"></div>
     <style>#map { height: 700px; }</style>
     
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <script>
navigator.geolocation.getCurrentPosition(function(position) {
    document.getElementById("lat").textContent = "Latitude : " + position.coords.latitude;
    document.getElementById("lon").textContent = "Longitude : " + position.coords.longitude;
    document.getElementById("alt").textContent = "Altitude : " + position.coords.altitude;
    document.getElementById("pre").textContent = "Précision : " + position.coords.accuracy;
    document.getElementById("vit").textContent = "Vitesse : " + position.coords.speed;
    document.getElementById("dat").textContent = "Date : " + new Date(position.timestamp);
    var map = L.map('map').setView([position.coords.latitude, position.coords.longitude], 13  );
    L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_terrain/{z}/{x}/{y}{r}.png?api_key=eed6a6b4-d171-43e4-8215-e5f8490b4245', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://stamen.com/">Stamen Design</a>, &copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
    }).addTo(map);
    var markerMaPos = L.marker([position.coords.latitude, position.coords.longitude]).addTo(map);
    var circleNice = L.circle([43.700001, 7.250000], {
        color: 'red',
        fillColor: '#f03',
        fillOpacity: 0.5,
        radius: 5000
    }).addTo(map);


    var polygon = L.polygon([
        [32.2949, -64.7814],
        [25.7891, -80.2265],
        [18.4663, -66.1057]
    ],
        {color: 'red'}
    ).addTo(map);


    var circleMaPos = L.circle([position.coords.latitude, position.coords.longitude], {
        color: 'red',
        fillColor: '#f03',
        fillOpacity: 0.5,
        radius: position.coords.accuracy
    }).addTo(map);


    var marseille = [43.296482, 5.36978];
    var nice = [43.700001, 7.250000];
    var markerMarseille = L.marker(marseille).addTo(map);
    var markerNice = L.marker(nice).addTo(map);
    L.polyline([marseille, nice], {
        color: 'green'
    }).addTo(map);
    var distanceMetres = map.distance([position.coords.latitude, position.coords.longitude], marseille);
    markerMaPos.bindPopup("Distance à Marseille : " + (distanceMetres / 1000) + " km");

    fetch('https://geo.api.gouv.fr/communes/06088?format=geojson&geometry=contour')
  .then(function(response) {
    return response.json();
  })
  .then(function(data) {
    L.geoJSON(data).addTo(map);
  });

  var start = position.coords.longitude + ',' + position.coords.latitude;
var end = nice[1] + ',' + nice[0]; // nice = [lat, lon], donc on inverse

fetch('https://router.project-osrm.org/route/v1/driving/' + start + ';' + end + '?overview=full&geometries=geojson')
  .then(function(response) {
    return response.json();
  })
  .then(function(data) {
    var routeGeoJSON = data.routes[0].geometry;
    L.geoJSON(routeGeoJSON, { color: 'purple' }).addTo(map);
  });

});

let watchId = navigator.geolocation.watchPosition(function(position) {
    document.getElementById("lat2").textContent = "Latitude : " + position.coords.latitude;
    document.getElementById("lon2").textContent = "Longitude : " + position.coords.longitude;
    document.getElementById("alt2").textContent = "Altitude : " + position.coords.altitude;
    document.getElementById("pre2").textContent = "Précision : " + position.coords.accuracy;
    document.getElementById("vit2").textContent = "Vitesse : " + position.coords.speed;
    document.getElementById("dat2").textContent = "Date : " + new Date(position.timestamp);
});



</script>


</body>

</html>
